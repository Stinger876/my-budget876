<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monarch-Pro v21.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --m-blue: #0a192f; 
            --m-teal: #17e9e1; 
            --m-bg: #0f172a; 
            --m-card: #1e293b; 
            --m-red: #fb7185; 
            --m-green: #34d399; 
            --m-orange: #fbbf24; 
            --m-text: #f8fafc; 
            --m-border: #334155;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--m-bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--m-text); 
            padding-bottom: 100px;
            line-height: 1.5;
        }

        /* Monarch-Style Layout */
        .dashboard-grid { display: grid; gap: 20px; }
        .card { background: var(--m-card); border-radius: 16px; padding: 20px; border: 1px solid var(--m-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Headers */
        .budget-header { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 24px; border-radius: 20px; margin-bottom: 20px; 
            border: 1px solid var(--m-teal); text-align: center;
        }
        .header-main { font-size: 1.8rem; font-weight: 800; margin: 10px 0; }
        .money { font-family: 'Roboto Mono', monospace; }

        /* Navigation */
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; background: #1e293b; padding: 5px; border-radius: 12px; }
        .tab { flex: 1; padding: 10px; border-radius: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab.active { background: var(--m-teal); color: var(--m-blue); }

        /* Progress Bars */
        .cat-progress-wrapper { margin-top: 8px; }
        .progress-bg { background: #334155; height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.4s ease; }

        /* Form Elements */
        input, select { 
            background: #0f172a; border: 1px solid var(--m-border); color: white; 
            padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }
        .btn-track { 
            background: var(--m-teal); color: var(--m-blue); border: none; 
            padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%;
        }

        /* Transaction List */
        .txn-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-bottom: 1px solid var(--m-border); 
        }
        .txn-info { display: flex; flex-direction: column; }
        .txn-meta { font-size: 11px; color: #94a3b8; }

        /* Modal */
        #startup-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; }
        
        .hidden { display: none !important; }
        .pos { color: var(--m-green); }
        .neg { color: var(--m-red); }
        
        canvas { max-height: 200px; margin: 10px auto; }
    </style>
</head>
<body>

    <div id="startup-modal">
        <div class="card" id="initial-choice" style="width: 90%; max-width: 400px; text-align: center;">
            <h2 style="color:var(--m-teal)">Monarch Pro</h2>
            <button class="btn-track" onclick="closeModal()">Open Dashboard</button>
            <button class="tab" onclick="showWizard()" style="margin-top:10px; width:100%">Setup New Budget</button>
        </div>

        <div class="card hidden" id="wizard-view" style="width: 90%; max-width: 400px;">
            <h3>Select Categories</h3>
            <div id="wizard-list" style="max-height: 300px; overflow-y: auto; text-align: left;">
                </div>
            <button class="btn-track" style="margin-top:20px;" onclick="finishWizard()">Complete Setup</button>
        </div>
    </div>

    <div class="budget-header" id="main-header">
        <div id="header-content"></div>
        <canvas id="spendingChart"></canvas>
    </div>

    <div class="tab-bar">
        <button class="tab active" onclick="switchTab('budget', this)">Budget</button>
        <button class="tab" onclick="switchTab('invest', this)">Net Worth</button>
        <button class="tab" onclick="switchTab('liab', this)">Debts</button>
    </div>

    <div id="view-budget">
        <div class="card" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin:0">Add Transaction</h3>
                <select id="month-filter" onchange="updateUI()" style="width: auto; margin:0; padding: 5px;">
                    <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                    <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                    <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
            </div>
            <input type="text" id="desc" placeholder="Merchant (e.g., Walmart, Netflix)" onblur="autoSuggestCategory()">
            <div style="display:flex; gap:10px;">
                <select id="cat-select"></select>
                <input type="text" inputmode="decimal" id="amt" placeholder="0.00" style="flex: 0.5;">
            </div>
            <input type="date" id="txn-date">
            <button class="btn-track" onclick="addTransaction()">Track Transaction</button>
        </div>

        <div id="budget-sections">
            </div>

        <details class="card" style="margin-top: 20px;">
            <summary style="cursor:pointer; font-weight:600;">Transaction History</summary>
            <div id="txn-list" style="margin-top:15px;"></div>
        </details>
    </div>

    <div id="view-invest" class="hidden">
        <div class="card" id="asset-list"></div>
        <button class="btn-track" style="margin-top:10px" onclick="addItem('assets')">+ Add Asset Account</button>
    </div>

    <div id="view-liab" class="hidden">
        <div class="card" id="liab-list"></div>
        <button class="btn-track" style="margin-top:10px; background: var(--m-orange);" onclick="addItem('liabs')">+ Add Liability</button>
    </div>

    <div class="card" style="margin-top: 30px; opacity: 0.8;">
        <h4 style="margin-top:0">System</h4>
        <div style="display:flex; gap:10px;">
            <button class="tab" style="background:#334155" onclick="exportToFile()">Backup JSON</button>
            <button class="tab" style="background:#450a0a; color: var(--m-red)" onclick="clearAllData()">Reset</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        let state = {
            txns: JSON.parse(localStorage.getItem('m_txns')) || [],
            planInc: JSON.parse(localStorage.getItem('m_p_inc')) || [],
            planExp: JSON.parse(localStorage.getItem('m_p_exp')) || [],
            assets: JSON.parse(localStorage.getItem('m_assets')) || [],
            liabs: JSON.parse(localStorage.getItem('m_liabs')) || [],
            activeTab: 'budget'
        };

        const categoryRules = {
            "walmart": "🛒 Groceries", "amazon": "🛒 Groceries",
            "netflix": "🎬 Entertainment", "spotify": "🎬 Entertainment",
            "shell": "🚗 Gas", "chevron": "🚗 Gas", "uber": "🚗 Gas"
        };

        let spendingChart = null;

        window.onload = () => {
            const today = new Date();
            document.getElementById('month-filter').value = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('txn-date').valueAsDate = today;
            initWizardList();
            updateUI();
        };

        function save() {
            Object.keys(state).forEach(key => {
                if(key !== 'activeTab') localStorage.setItem(`m_${key}`, JSON.stringify(state[key]));
            });
            updateUI();
        }

        // --- Logic ---
        function autoSuggestCategory() {
            const desc = document.getElementById('desc').value.toLowerCase();
            const catSelect = document.getElementById('cat-select');
            for (let key in categoryRules) {
                if (desc.includes(key)) {
                    catSelect.value = categoryRules[key];
                    break;
                }
            }
        }

        function addTransaction() {
            const d = document.getElementById('desc').value;
            const c = document.getElementById('cat-select').value;
            const a = parseFloat(document.getElementById('amt').value);
            if(!d || isNaN(a)) return;

            const isInc = state.planInc.some(p => p.name === c);
            state.txns.unshift({
                id: Date.now(),
                desc: d,
                cat: c,
                date: document.getElementById('txn-date').value,
                amt: isInc ? Math.abs(a) : -Math.abs(a)
            });
            
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            save();
        }

        function updateUI() {
            const month = document.getElementById('month-filter').value;
            const monthTxns = state.txns.filter(t => t.date.split('-')[1] === month);
            
            renderHeader(monthTxns);
            renderBudget(monthTxns);
            renderList('asset-list', state.assets, 'assets');
            renderList('liab-list', state.liabs, 'liabs');
            renderTransactions(monthTxns);
            updateChart(monthTxns);
        }

        function renderHeader(txns) {
            const spent = txns.filter(t => t.amt < 0).reduce((s, t) => s + Math.abs(t.amt), 0);
            const income = txns.filter(t => t.amt > 0).reduce((s, t) => s + t.amt, 0);
            const budgetTotal = state.planExp.reduce((s, p) => s + p.amt, 0);

            document.getElementById('header-content').innerHTML = `
                <div style="font-size: 14px; color: #94a3b8;">${state.activeTab === 'budget' ? 'Total Spending' : 'Net Worth'}</div>
                <div class="header-main money">$${(state.activeTab === 'budget' ? spent : calculateNetWorth()).toLocaleString()}</div>
                <div style="font-size: 12px; opacity: 0.8;">
                    ${state.activeTab === 'budget' ? `of $${budgetTotal.toLocaleString()} budget` : `Liabilities: $${calculateTotalLiabs().toLocaleString()}`}
                </div>
            `;
        }

        function renderBudget(monthTxns) {
            const container = document.getElementById('budget-sections');
            let html = `<h4>Income</h4>`;
            
            state.planInc.forEach(p => html += renderCatRow(p, monthTxns, 'pos'));
            html += `<h4 style="margin-top:20px">Expenses</h4>`;
            state.planExp.forEach(p => html += renderCatRow(p, monthTxns, 'neg'));
            
            container.innerHTML = html;
            
            // Sync cat-select
            const sel = document.getElementById('cat-select');
            const options = [...state.planInc, ...state.planExp].map(c => `<option value="${c.name}">${c.name}</option>`);
            sel.innerHTML = options.join('');
        }

        function renderCatRow(plan, txns, theme) {
            const actual = txns.filter(t => t.cat === plan.name).reduce((s, t) => s + Math.abs(t.amt), 0);
            const percent = plan.amt > 0 ? Math.min((actual / plan.amt) * 100, 100) : 0;
            const overBudget = actual > plan.amt && plan.amt > 0;

            return `
                <div style="margin-bottom: 15px;">
                    <div style="display:flex; justify-content:space-between; font-size: 13px; font-weight:600;">
                        <span>${plan.name}</span>
                        <span class="money">$${actual.toFixed(0)} <span style="font-weight:400; color:#94a3b8">/ $${plan.amt}</span></span>
                    </div>
                    <div class="cat-progress-wrapper">
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${percent}%; background: ${overBudget ? 'var(--m-red)' : 'var(--m-teal)'}"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTransactions(txns) {
            const list = document.getElementById('txn-list');
            list.innerHTML = txns.map(t => `
                <div class="txn-item">
                    <div class="txn-info">
                        <span style="font-weight:600; font-size:14px;">${t.desc}</span>
                        <span class="txn-meta">${t.cat} • ${t.date}</span>
                    </div>
                    <span class="money ${t.amt > 0 ? 'pos' : ''}" style="font-weight:800;">
                        ${t.amt > 0 ? '+' : ''}$${Math.abs(t.amt).toFixed(2)}
                    </span>
                </div>
            `).join('');
        }

        function updateChart(txns) {
            const data = {};
            txns.filter(t => t.amt < 0).forEach(t => {
                data[t.cat] = (data[t.cat] || 0) + Math.abs(t.amt);
            });

            const ctx = document.getElementById('spendingChart').getContext('2d');
            if(spendingChart) spendingChart.destroy();
            
            spendingChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        data: Object.values(data),
                        backgroundColor: ['#17e9e1', '#34d399', '#fbbf24', '#fb7185', '#818cf8', '#a78bfa'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '70%', plugins: { legend: { display: false } } }
            });
        }

        // --- Helpers ---
        function calculateNetWorth() {
            const a = state.assets.reduce((s, i) => s + i.amt, 0);
            const l = state.liabs.reduce((s, i) => s + i.amt, 0);
            return a - l;
        }

        function calculateTotalLiabs() { return state.liabs.reduce((s, i) => s + i.amt, 0); }

        function switchTab(tab, el) {
            state.activeTab = tab;
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('view-budget').classList.toggle('hidden', tab !== 'budget');
            document.getElementById('view-invest').classList.toggle('hidden', tab !== 'invest');
            document.getElementById('view-liab').classList.toggle('hidden', tab !== 'liab');
            updateUI();
        }

        function closeModal() { document.getElementById('startup-modal').classList.add('hidden'); }
        
        function showWizard() { 
            document.getElementById('initial-choice').classList.add('hidden');
            document.getElementById('wizard-view').classList.remove('hidden');
        }

        function initWizardList() {
            const cats = [
                {n: "💵 Paychecks", t: "inc"}, {n: "🛒 Groceries", t: "exp"},
                {n: "🏠 Rent/Mortgage", t: "exp"}, {n: "🎬 Entertainment", t: "exp"},
                {n: "🚗 Gas & Auto", t: "exp"}, {n: "📱 Utilities", t: "exp"}
            ];
            document.getElementById('wizard-list').innerHTML = cats.map(c => `
                <label style="display:block; padding:10px; border-bottom:1px solid #334155;">
                    <input type="checkbox" checked data-cat="${c.n}" data-type="${c.t}" style="width:auto;"> ${c.n}
                </label>
            `).join('');
        }

        function finishWizard() {
            state.planInc = []; state.planExp = [];
            document.querySelectorAll('#wizard-list input:checked').forEach(i => {
                const item = {name: i.dataset.cat, amt: 0};
                if(i.dataset.type === 'inc') state.planInc.push(item);
                else state.planExp.push(item);
            });
            save(); closeModal();
        }

        function renderList(id, data, key) {
            document.getElementById(id).innerHTML = data.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span>${item.name}</span>
                    <input type="number" value="${item.amt}" style="width:120px; margin:0;" 
                        onchange="state.${key}[${idx}].amt = parseFloat(this.value); save();">
                </div>
            `).join('');
        }

        function addItem(key) {
            const n = prompt("Name:");
            if(n) { state[key].push({name: n, amt: 0}); save(); }
        }

        function clearAllData() { if(confirm("Erase everything?")) { localStorage.clear(); location.reload(); } }
        
        function exportToFile() {
            const blob = new Blob([JSON.stringify(state)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `monarch_pro_backup.json`;
            a.click();
        }
    </script>
</body>
</html>
