<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monarch-Lite Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --m-blue: #0a192f; 
            --m-teal: #17e9e1; 
            --m-bg: #0f0f0f; 
            --m-card: #1c1c1e; 
            --m-red: #ff5252; 
            --m-green: #2ecc71; 
            --m-text: #ffffff; 
            --m-border: #2c2c2e;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--m-bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--m-text); 
            padding-bottom: 100px;
            line-height: 1.5;
        }

        /* --- UI Enhancements --- */
        .budget-header { 
            padding: 30px 20px; 
            border-radius: 24px; 
            margin-bottom: 20px; 
            text-align: center; 
            position: relative;
            background: linear-gradient(145deg, #1b4d3e, #0a192f);
            border: 1px solid var(--m-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-main { 
            font-size: 2.2rem; 
            font-weight: 800; 
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--m-teal), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .card { 
            background: var(--m-card); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border: 1px solid var(--m-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* --- Form Inputs --- */
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0;
            border: 1px solid var(--m-border); 
            background: #2c2c2e; 
            color: white; 
            border-radius: 12px; 
            font-size: 14px; 
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--m-teal); outline: none; }

        .btn-track { 
            width: 100%; 
            padding: 16px; 
            background: var(--m-teal); 
            color: var(--m-blue); 
            border-radius: 14px; 
            border: none; 
            font-weight: 800; 
            text-transform: uppercase; 
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-track:active { transform: scale(0.98); }

        /* --- Tabs --- */
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; background: #1c1c1e; padding: 5px; border-radius: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border-radius: 10px; font-weight: 600; cursor: pointer; color: #888; border: none; }
        .tab.active { background: #2c2c2e; color: var(--m-teal); }

        /* --- Visuals --- */
        .chart-container { width: 100%; height: 200px; margin: 20px 0; }
        
        .spending-bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .spending-bar-fill { height: 100%; width: 0%; transition: width 0.8s ease-out; }

        .txn-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--m-border); }
        .pos { color: var(--m-green); }
        .neg { color: var(--m-red); }

        /* Startup Modal */
        #startup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div id="startup-modal">
        <div class="card" style="width: 90%; max-width: 400px; text-align: center;">
            <h2 style="color:var(--m-teal)">Monarch-Lite Pro</h2>
            <button class="btn-track" onclick="closeModal()">Enter Dashboard</button>
            <p style="font-size: 12px; color: #666; margin-top: 15px;">Your data is stored locally on this device.</p>
        </div>
    </div>

    <div class="budget-header" id="main-header">
        <div id="header-label" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7;">Monthly Spending</div>
        <div class="header-main" id="header-amt">$0.00</div>
        <div id="header-subtext" style="font-size: 14px; opacity: 0.8;">Cash Flow: $0.00</div>
        <div class="spending-bar-bg"><div id="header-bar" class="spending-bar-fill"></div></div>
    </div>

    <nav class="tab-bar">
        <button class="tab active" onclick="switchTab('budget', this)">Budget</button>
        <button class="tab" onclick="switchTab('invest', this)">Net Worth</button>
        <button class="tab" onclick="switchTab('liab', this)">Debts</button>
    </nav>

    <div id="view-budget">
        <div class="card">
            <b style="font-size: 14px; color: var(--m-teal);">Spending Trend</b>
            <div class="chart-container">
                <canvas id="spendingChart"></canvas>
            </div>
        </div>

        <div class="card">
            <b style="display:block; margin-bottom:10px;">Quick Track</b>
            <input type="text" id="desc" placeholder="Merchant (e.g. Starbucks)" oninput="smartPredict(this.value)">
            <select id="cat-select"></select>
            <div style="display:flex; gap:10px;">
                <input type="text" inputmode="decimal" id="amt" placeholder="0.00" style="font-weight:bold; color:var(--m-teal);">
                <input type="date" id="txn-date">
            </div>
            <button class="btn-track" onclick="addTransaction()">Add Transaction</button>
        </div>

        <div id="budget-lists">
            <div class="card">
                <b style="color:var(--m-green); font-size:12px;">INCOME</b>
                <div id="income-list"></div>
            </div>
            <div class="card">
                <b style="color:var(--m-red); font-size:12px;">EXPENSES</b>
                <div id="expense-list"></div>
            </div>
        </div>
    </div>

    <div id="view-invest" style="display:none;" class="card"><h2>Investments</h2><div id="invest-list"></div></div>
    <div id="view-liab" style="display:none;" class="card"><h2>Liabilities</h2><div id="liab-list"></div></div>

    <script>
        // --- Data & State ---
        let txns = JSON.parse(localStorage.getItem('m_txns')) || [];
        let planInc = JSON.parse(localStorage.getItem('m_p_inc')) || [{name: "💵 Paychecks", amt: 5000}];
        let planExp = JSON.parse(localStorage.getItem('m_p_exp')) || [{name: "🛒 Groceries", amt: 600}, {name: "🏠 Rent", amt: 2000}];
        let activeTab = 'budget';
        let myChart = null;

        // --- Auto-Categorization Logic ---
        const smartMap = {
            "starbucks": "🛒 Groceries",
            "amazon": "🛒 Shopping",
            "uber": "🚗 Transport",
            "rent": "🏠 Rent",
            "shell": "🚗 Transport",
            "walmart": "🛒 Groceries"
        };

        function smartPredict(val) {
            const lowVal = val.toLowerCase();
            const catSelect = document.getElementById('cat-select');
            for (let key in smartMap) {
                if (lowVal.includes(key)) {
                    catSelect.value = smartMap[key];
                    break;
                }
            }
        }

        // --- Core Functions ---
        window.onload = () => {
            document.getElementById('txn-date').valueAsDate = new Date();
            initChart();
            updateUI();
        };

        function closeModal() { document.getElementById('startup-modal').style.display = 'none'; }

        function switchTab(tab, el) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('view-budget').style.display = tab === 'budget' ? 'block' : 'none';
            document.getElementById('view-invest').style.display = tab === 'invest' ? 'block' : 'none';
            document.getElementById('view-liab').style.display = tab === 'liab' ? 'block' : 'none';
            updateUI();
        }

        function addTransaction() {
            const d = document.getElementById('desc').value;
            const c = document.getElementById('cat-select').value;
            const a = parseFloat(document.getElementById('amt').value);
            if(!d || isNaN(a)) return;

            const isInc = planInc.some(p => p.name === c);
            txns.unshift({
                id: Date.now(),
                desc: d,
                cat: c,
                amt: isInc ? Math.abs(a) : -Math.abs(a),
                date: document.getElementById('txn-date').value
            });

            localStorage.setItem('m_txns', JSON.stringify(txns));
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            updateUI();
        }

        function updateUI() {
            const totalSpent = txns.filter(t => t.amt < 0).reduce((s, t) => s + Math.abs(t.amt), 0);
            const totalEarned = txns.filter(t => t.amt > 0).reduce((s, t) => s + t.amt, 0);
            const budgetLimit = planExp.reduce((s, p) => s + p.amt, 0);

            // Update Header
            document.getElementById('header-amt').innerText = `$${totalSpent.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('header-subtext').innerHTML = `Cash Flow: <span class="${totalEarned - totalSpent >= 0 ? 'pos' : 'neg'}">$${(totalEarned - totalSpent).toFixed(2)}</span>`;
            
            const perc = Math.min((totalSpent / budgetLimit) * 100, 100);
            const bar = document.getElementById('header-bar');
            bar.style.width = perc + '%';
            bar.style.background = (totalSpent > budgetLimit) ? 'var(--m-red)' : 'var(--m-green)';

            // Update Lists
            renderLists();
            updateChart(totalSpent, totalEarned);
        }

        function renderLists() {
            const catSelect = document.getElementById('cat-select');
            let catHTML = '';
            [...planInc, ...planExp].forEach(p => catHTML += `<option value="${p.name}">${p.name}</option>`);
            catSelect.innerHTML = catHTML;

            const expList = document.getElementById('expense-list');
            expList.innerHTML = planExp.map(p => {
                const actual = txns.filter(t => t.cat === p.name).reduce((s, t) => s + Math.abs(t.amt), 0);
                return `<div class="txn-row">
                    <span>${p.name}</span>
                    <span style="font-size:12px; opacity:0.6;">$${actual} / $${p.amt}</span>
                </div>`;
            }).join('');
        }

        // --- Chart.js Integration ---
        function initChart() {
            const ctx = document.getElementById('spendingChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Spending',
                        data: [0, 0, 0, 0],
                        borderColor: '#17e9e1',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(23, 233, 225, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { color: '#555' } }
                    }
                }
            });
        }

        function updateChart(total) {
            // Simulated weekly breakdown for visual impact
            myChart.data.datasets[0].data = [total * 0.2, total * 0.5, total * 0.8, total];
            myChart.update();
        }
    </script>
</body>
</html>
