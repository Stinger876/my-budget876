<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monarch-Lite Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --m-blue: #0a192f; --m-teal: #17e9e1; --m-bg: #0f0f0f; 
            --m-card: #1c1c1e; --m-red: #ff5252; --m-green: #2ecc71; 
            --m-text: #ffffff; --m-border: #2c2c2e;
        }
        body { font-family: 'Inter', sans-serif; background: var(--m-bg); margin: 0; padding: 15px; color: var(--m-text); padding-bottom: 40px; }
        
        .budget-header { padding: 25px 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; background: linear-gradient(145deg, #1b4d3e, #0a192f); border: 1px solid var(--m-border); }
        .header-main { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, var(--m-teal), #ffffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 5px 0; }
        
        .card { background: var(--m-card); padding: 18px; border-radius: 18px; margin-bottom: 15px; border: 1px solid var(--m-border); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--m-border); background: #2c2c2e; color: white; border-radius: 10px; box-sizing: border-box; }
        
        .btn-track { width: 100%; padding: 15px; background: var(--m-teal); color: var(--m-blue); border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
        
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; background: #1c1c1e; padding: 4px; border-radius: 12px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border-radius: 8px; font-weight: 600; cursor: pointer; color: #666; border: none; }
        .tab.active { background: #2c2c2e; color: var(--m-teal); }

        .chart-container { position: relative; height: 180px; width: 100%; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--m-border); font-size: 14px; }
        .pos { color: var(--m-green); } .neg { color: var(--m-red); }
    </style>
</head>
<body>

    <div class="budget-header">
        <div style="font-size: 11px; text-transform: uppercase; opacity: 0.6;">Total Monthly Spending</div>
        <div class="header-main" id="header-amt">$0.00</div>
        <div id="header-subtext" style="font-size: 13px;">Cash Flow: $0.00</div>
    </div>

    <nav class="tab-bar">
        <button class="tab active" onclick="switchTab('budget', this)">Budget</button>
        <button class="tab" onclick="switchTab('history', this)">History</button>
    </nav>

    <div id="view-budget">
        <div class="card">
            <div class="chart-container"><canvas id="spendingChart"></canvas></div>
        </div>

        <div class="card">
            <b style="font-size: 14px;">Quick Add</b>
            <input type="text" id="desc" placeholder="Merchant name...">
            <select id="cat-select">
                <option value="🛒 Groceries">🛒 Groceries</option>
                <option value="🏠 Rent">🏠 Rent</option>
                <option value="☕ Coffee">☕ Coffee</option>
                <option value="💰 Income">💰 Income</option>
            </select>
            <input type="number" id="amt" placeholder="0.00">
            <button class="btn-track" onclick="addTransaction()">Track Transaction</button>
        </div>
    </div>

    <div id="view-history" style="display:none;">
        <div class="card" id="history-list">
            </div>
    </div>

    <script>
        // 1. DATA INITIALIZATION
        let txns = JSON.parse(localStorage.getItem('m_txns')) || [];
        let myChart = null;

        // 2. CHART INITIALIZATION (Runs once)
        function initChart() {
            const ctx = document.getElementById('spendingChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Wk 1', 'Wk 2', 'Wk 3', 'Wk 4'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        borderColor: '#17e9e1',
                        borderWidth: 3,
                        tension: 0.4,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: 'rgba(23, 233, 225, 0.05)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } }, y: { display: false } }
                }
            });
        }

        // 3. TAB SWITCHING
        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('view-budget').style.display = tab === 'budget' ? 'block' : 'none';
            document.getElementById('view-history').style.display = tab === 'history' ? 'block' : 'none';
            updateUI();
        }

        // 4. ADD TRANSACTION
        function addTransaction() {
            const desc = document.getElementById('desc').value;
            const cat = document.getElementById('cat-select').value;
            const amt = parseFloat(document.getElementById('amt').value);

            if (!desc || isNaN(amt)) return alert("Please fill in all fields");

            const newTxn = {
                id: Date.now(),
                desc,
                cat,
                amt: cat === '💰 Income' ? Math.abs(amt) : -Math.abs(amt),
                date: new Date().toLocaleDateString()
            };

            txns.unshift(newTxn);
            localStorage.setItem('m_txns', JSON.stringify(txns));
            
            // Clear inputs
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            updateUI();
        }

        // 5. UPDATE UI & RECALC
        function updateUI() {
            const totalSpent = txns.filter(t => t.amt < 0).reduce((sum, t) => sum + Math.abs(t.amt), 0);
            const totalEarned = txns.filter(t => t.amt > 0).reduce((sum, t) => sum + t.amt, 0);

            // Update Header
            document.getElementById('header-amt').innerText = `$${totalSpent.toLocaleString()}`;
            document.getElementById('header-subtext').innerHTML = 
                `Cash Flow: <span class="${totalEarned - totalSpent >= 0 ? 'pos' : 'neg'}">$${(totalEarned - totalSpent).toLocaleString()}</span>`;

            // Update History List
            const histList = document.getElementById('history-list');
            histList.innerHTML = txns.length > 0 ? '' : '<p style="text-align:center; opacity:0.5;">No transactions yet.</p>';
            txns.forEach(t => {
                histList.innerHTML += `
                    <div class="row">
                        <div><b>${t.desc}</b><br><small>${t.cat}</small></div>
                        <div class="${t.amt >= 0 ? 'pos' : 'neg'}">$${Math.abs(t.amt).toFixed(2)}</div>
                    </div>`;
            });

            // Update Chart (Simulating weekly progress)
            if (myChart) {
                myChart.data.datasets[0].data = [totalSpent * 0.2, totalSpent * 0.45, totalSpent * 0.7, totalSpent];
                myChart.update();
            }
        }

        // START APP
        window.onload = () => {
            initChart();
            updateUI();
        };
    </script>
</body>
</html>
