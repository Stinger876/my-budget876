<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monarch-Lite Pro</title>

<style>
:root{
  --bg:#0e1117;
  --card:#161b22;
  --muted:#8b949e;
  --line:#30363d;
  --teal:#2dd4bf;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#f59e0b;
  --blue:#38bdf8;
}

body{
  margin:0;
  padding:12px;
  padding-bottom:90px;
  font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:white;
}

/* ===== HEADER ===== */
.budget-header{
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(180deg,#0e1117,#0e1117cc);
  backdrop-filter:blur(6px);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 16px;
  margin-bottom:14px;
}

.header-meta{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
}

.header-main{
  font-size:20px;
  font-weight:800;
  margin-top:10px;
}

/* ===== TABS ===== */
.tab-bar{
  display:flex;
  gap:8px;
  margin:12px 0;
}

.tab{
  flex:1;
  padding:12px;
  background:#0b0f14;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--muted);
  font-weight:700;
}

.tab.active{
  background:var(--teal);
  color:#022c22;
  border:none;
}

/* ===== CARDS ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

/* ===== BUDGET ROW ===== */
.budget-row{
  display:grid;
  grid-template-columns:1fr 70px 70px;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.budget-row:last-child{border-bottom:none;}

.progress{
  height:6px;
  background:#222;
  border-radius:6px;
  overflow:hidden;
  margin-top:6px;
}

.progress > div{
  height:100%;
}

/* ===== INPUTS ===== */
input,select{
  width:100%;
  padding:8px;
  background:#0b0f14;
  border:1px solid var(--line);
  border-radius:8px;
  color:white;
}

.btn-track{
  width:100%;
  padding:16px;
  background:var(--teal);
  border:none;
  border-radius:14px;
  font-weight:900;
  color:#022c22;
}

/* ===== TXN ===== */
.txn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-radius:10px;
  background:#0b0f14;
  border:1px solid var(--line);
  margin-bottom:6px;
}

.pos{color:var(--green);}
.neg{color:var(--red);}

/* ===== DETAILS ===== */
details summary{
  cursor:pointer;
  font-weight:700;
  padding:10px;
  background:#0b0f14;
  border-radius:10px;
  border:1px solid var(--line);
  margin-bottom:6px;
}
details[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0;}
details .content{
  padding:10px;
  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 14px 14px;
}
</style>
</head>

<body>

<div class="budget-header">
  <div class="header-meta">
    <span id="meta-file">File: Browser Storage</span>
    <span id="meta-saved">Last Saved: Never</span>
  </div>
  <div id="header-content" class="header-main"></div>
</div>

<select id="month-filter" onchange="updateUI()">
  <option value="01">January</option><option value="02">February</option>
  <option value="03">March</option><option value="04">April</option>
  <option value="05">May</option><option value="06">June</option>
  <option value="07">July</option><option value="08">August</option>
  <option value="09">September</option><option value="10">October</option>
  <option value="11">November</option><option value="12">December</option>
</select>

<nav class="tab-bar">
  <button class="tab active" id="tab-budget" onclick="switchTab('budget')">Budget</button>
  <button class="tab" id="tab-invest" onclick="switchTab('invest')">Invest</button>
  <button class="tab" id="tab-liab" onclick="switchTab('liab')">Liabilities</button>
</nav>

<!-- ===== BUDGET ===== -->
<div id="view-budget">
  <div class="card">
    <details open>
      <summary>Income</summary>
      <div id="income-list"></div>
    </details>
  </div>

  <div class="card">
    <details open>
      <summary>Expenses</summary>
      <div id="expense-list"></div>
    </details>
  </div>

  <div class="card">
    <b>Add Transaction</b>
    <input id="desc" placeholder="Merchant">
    <select id="cat-select" style="margin:6px 0"></select>
    <div style="display:flex;gap:6px;">
      <input type="date" id="txn-date">
      <input id="amt" inputmode="decimal" placeholder="Amount">
    </div>
    <button class="btn-track" onclick="addTransaction()">Track</button>
  </div>

  <details>
    <summary>Transactions <span id="txn-count"></span></summary>
    <div id="txn-list"></div>
  </details>
</div>

<!-- ===== INVEST ===== -->
<div id="view-invest" style="display:none">
  <div class="card" id="invest-main-list"></div>
  <button class="btn-track" onclick="addItem('assets')">Add Asset</button>
</div>

<!-- ===== LIAB ===== -->
<div id="view-liab" style="display:none">
  <div class="card" id="liab-main-list"></div>
  <button class="btn-track" style="background:var(--orange)" onclick="addItem('liabs')">Add Liability</button>
</div>

<script>
/* === YOUR ORIGINAL LOGIC — UNCHANGED === */

let txns=JSON.parse(localStorage.getItem('m_txns'))||[];
let planInc=JSON.parse(localStorage.getItem('m_p_inc'))||[];
let planExp=JSON.parse(localStorage.getItem('m_p_exp'))||[];
let assets=JSON.parse(localStorage.getItem('m_assets'))||[];
let liabs=JSON.parse(localStorage.getItem('m_liabs'))||[];
let activeTab='budget';

window.onload=()=>{
  const d=new Date();
  month-filter.value=String(d.getMonth()+1).padStart(2,'0');
  txn-date.valueAsDate=d;
  updateUI();
};

function switchTab(t){
  activeTab=t;
  ['budget','invest','liab'].forEach(x=>{
    document.getElementById(`tab-${x}`).classList.toggle('active',x===t);
    document.getElementById(`view-${x}`).style.display=x===t?'block':'none';
  });
  updateUI();
}

function updateUI(){
  let incHTML='',expHTML='',txnHTML='',catHTML='';
  const m=month-filter.value;
  const monthTxns=txns.filter(t=>t.date?.split('-')[1]===m);

  document.getElementById('txn-count').innerText=`(${monthTxns.length})`;

  let actExp=0,actInc=0;
  monthTxns.forEach(t=>t.amt<0?actExp+=-t.amt:actInc+=t.amt);

  header-content.innerHTML=activeTab==='budget'
   ?`$${actInc.toFixed(2)} income • $${actExp.toFixed(2)} spent`
   :activeTab==='invest'
   ?`Net Worth`
   :`Liabilities`;

  planInc.forEach((p,i)=>{
    const used=monthTxns.filter(t=>t.cat===p.name).reduce((s,t)=>s+t.amt,0);
    catHTML+=`<option>${p.name}</option>`;
    incHTML+=`
    <div class="budget-row">
      <div>${p.name}
        <div class="progress">
          <div style="width:${Math.min(100,(used/p.amt||0)*100)}%;background:var(--green)"></div>
        </div>
      </div>
      <input value="${p.amt}" onchange="planInc[${i}].amt=this.value;save()">
      <div>$${(p.amt-used).toFixed(2)}</div>
    </div>`;
  });

  planExp.forEach((p,i)=>{
    const used=monthTxns.filter(t=>t.cat===p.name).reduce((s,t)=>s+Math.abs(t.amt),0);
    catHTML+=`<option>${p.name}</option>`;
    expHTML+=`
    <div class="budget-row">
      <div>${p.name}
        <div class="progress">
          <div style="width:${Math.min(100,(used/p.amt||0)*100)}%;background:${used>p.amt?'var(--red)':'var(--teal)'}"></div>
        </div>
      </div>
      <input value="${p.amt}" onchange="planExp[${i}].amt=this.value;save()">
      <div>$${(p.amt-used).toFixed(2)}</div>
    </div>`;
  });

  monthTxns.forEach(t=>{
    txnHTML+=`
      <div class="txn">
        <span>${t.cat} • ${t.desc}</span>
        <span class="${t.amt<0?'neg':'pos'}">$${Math.abs(t.amt).toFixed(2)}</span>
      </div>`;
  });

  income-list.innerHTML=incHTML;
  expense-list.innerHTML=expHTML;
  txn-list.innerHTML=txnHTML;
  cat-select.innerHTML=catHTML;
}

function save(){
  localStorage.setItem('m_txns',JSON.stringify(txns));
  localStorage.setItem('m_p_inc',JSON.stringify(planInc));
  localStorage.setItem('m_p_exp',JSON.stringify(planExp));
}

function addTransaction(){
  const d=desc.value,c=cat-select.value,a=parseFloat(amt.value);
  if(!d||!a)return;
  const inc=planInc.some(p=>p.name===c);
  txns.unshift({desc:d,cat:c,date:txn-date.value,amt:inc?Math.abs(a):-Math.abs(a)});
  desc.value='';amt.value='';
  save();updateUI();
}

function addItem(k){
  const n=prompt('Name');
  if(n){(k==='assets'?assets:liabs).push({name:n,amt:0});save();}
}
</script>
</body>
</html>
