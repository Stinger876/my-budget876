<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monarch-Lite v21.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --m-blue: #0a192f; 
            --m-teal: #17e9e1; 
            --m-bg: #0b0e14; /* Deeper background */
            --m-card: #1c1c1e; /* Elevated card color */
            --m-red: #ff5252; 
            --m-green: #2ecc71; 
            --m-header-green: #1b4d3e; 
            --m-orange: #ff9f43; 
            --m-text: #ffffff; 
            --m-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--m-bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--m-text); 
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Glassmorphism Header */
        .budget-header { 
            color: white; 
            padding: 35px 20px; 
            border-radius: 24px; 
            margin-bottom: 20px; 
            text-align: center; 
            position: relative; 
            background: linear-gradient(135deg, #1b4d3e 0%, #0a192f 100%);
            border: 1px solid var(--m-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-meta { 
            font-size: 10px; 
            opacity: 0.5; 
            display: flex; 
            justify-content: space-between; 
            font-family: monospace; 
            position: absolute; 
            top: 15px; left: 20px; right: 20px; 
        }

        .header-main { 
            font-size: 2.5rem; /* Larger, more impactful */
            font-weight: 800; 
            margin: 10px 0;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #ffffff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Modern Tabs */
        .tab-bar { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 14px;
        }
        .tab { 
            flex: 1; 
            padding: 12px; 
            text-align: center; 
            background: transparent; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            color: #888; 
            border: none; 
            transition: 0.2s;
        }
        .tab.active { 
            background: var(--m-teal); 
            color: var(--m-blue) !important; 
        }

        /* Cards & UI Elements */
        .card { 
            background: var(--m-card); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border: 1px solid var(--m-border);
        }

        .budget-row { 
            display: grid; 
            grid-template-columns: 1fr 80px 80px; 
            gap: 12px; 
            align-items: center; 
            padding: 16px 0; 
            border-bottom: 1px solid var(--m-border); 
            font-size: 14px; 
        }

        .row-label { 
            font-size: 10px; 
            color: #666; 
            text-transform: uppercase; 
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Inputs & Buttons */
        input, select { 
            width: 100%; 
            padding: 14px; 
            background: #2c2c2e; 
            border: 1px solid var(--m-border); 
            color: white; 
            border-radius: 12px; 
            font-size: 14px; 
            box-sizing: border-box; 
            margin-bottom: 10px;
        }

        .btn-track { 
            width: 100%; 
            padding: 16px; 
            background: var(--m-teal); 
            color: var(--m-blue); 
            border-radius: 12px; 
            border: none; 
            font-weight: 800; 
            text-transform: uppercase; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(23, 233, 225, 0.3);
        }

        .spending-bar-bg { 
            background: rgba(255,255,255,0.1); 
            height: 6px; 
            border-radius: 10px; 
            margin: 15px 0; 
            overflow: hidden; 
        }
        
        details summary { 
            padding: 15px; 
            background: #2c2c2e; 
            border-radius: 12px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            list-style: none;
            border: 1px solid var(--m-border);
        }

        .pos { color: var(--m-green); }
        .neg { color: var(--m-red); }

        #startup-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 9999; 
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div id="startup-modal">
        <div class="card" style="text-align: center; width: 80%; max-width: 400px;">
            <h2 style="color:var(--m-teal); margin-top: 0;">Welcome</h2>
            <button class="btn-track" onclick="closeModal()">Open My Dashboard</button>
        </div>
    </div>

    <div class="budget-header bg-spending" id="main-header">
        <div class="header-meta">
            <span id="meta-file">File: Browser Storage</span>
            <span id="meta-saved">Last Saved: Never</span>
        </div>
        <div id="header-content">
            <div class="header-main" id="header-val">$0.00</div>
            <div style="font-size: 13px; opacity: 0.7;">Monthly Spending</div>
        </div>
    </div>

    <select id="month-filter" onchange="updateUI()" style="margin-bottom:15px; background: transparent; border: none; font-weight: bold; font-size: 1.1rem;">
        <option value="01">January</option><option value="02">February</option><option value="03">March</option>
        <option value="04">April</option><option value="05">May</option><option value="06">June</option>
        <option value="07">July</option><option value="08">August</option><option value="09">September</option>
        <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>

    <nav class="tab-bar">
        <button class="tab active" id="tab-budget" onclick="switchTab('budget')">Budget</button>
        <button class="tab" id="tab-invest" onclick="switchTab('invest')">Invest</button>
        <button class="tab" id="tab-liab" onclick="switchTab('liab')">Debts</button>
    </nav>

    <div id="view-budget">
        <div class="card">
            <div id="sum-exp-text" style="font-size: 12px; color: #888; font-weight: 700; margin-bottom: 15px;">EXPENSES</div>
            <div id="expense-list"></div>
            <button class="btn-track" style="background: none; border: 1px dashed #555; color: #888; margin-top: 15px;" onclick="addCustomCat('exp')">+ Add Category</button>
        </div>

        <div class="card">
            <b style="font-size: 1.1rem;">Track Spending</b>
            <div style="margin-top: 15px;">
                <input type="text" id="desc" placeholder="Merchant name">
                <select id="cat-select"></select>
                <div style="display:flex; gap:10px;">
                    <input type="date" id="txn-date" style="flex:1">
                    <input type="number" id="amt" placeholder="0.00" style="flex:1">
                </div>
                <button class="btn-track" onclick="addTransaction()">Track Transaction</button>
            </div>
        </div>
    </div>

    <div id="view-invest" style="display:none;"><div class="card" id="invest-main-list"></div></div>
    <div id="view-liab" style="display:none;"><div class="card" id="liab-main-list"></div></div>

    <script>
        // The original logic is kept intact to ensure functionality
        let txns = JSON.parse(localStorage.getItem('m_txns')) || [];
        let planInc = JSON.parse(localStorage.getItem('m_p_inc')) || [{name: 'Salary', amt: 5000}];
        let planExp = JSON.parse(localStorage.getItem('m_p_exp')) || [{name: 'Rent', amt: 1500}, {name: 'Groceries', amt: 500}];
        let activeTab = 'budget';

        window.onload = () => {
            const today = new Date();
            document.getElementById('month-filter').value = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('txn-date').valueAsDate = today;
            updateUI();
        };

        function saveInternal() {
            localStorage.setItem('m_txns', JSON.stringify(txns));
            localStorage.setItem('m_p_inc', JSON.stringify(planInc));
            localStorage.setItem('m_p_exp', JSON.stringify(planExp));
            updateUI();
        }

        function updateUI() {
            const expL = document.getElementById('expense-list');
            const catS = document.getElementById('cat-select');
            const month = document.getElementById('month-filter').value;
            
            let expHTML = '';
            let catHTML = '';

            const monthTxns = txns.filter(t => t.date && t.date.split('-')[1] === month);
            const totalSpent = monthTxns.filter(t => t.amt < 0).reduce((s, t) => s + Math.abs(t.amt), 0);
            
            document.getElementById('header-val').innerText = `$${totalSpent.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            planExp.forEach((p, idx) => {
                const spent = monthTxns.filter(t => t.cat === p.name).reduce((s, t) => s + Math.abs(t.amt), 0);
                expHTML += `
                    <div class="budget-row">
                        <span style="font-weight:600;">${p.name}</span>
                        <input type="number" value="${p.amt}" onchange="planExp[${idx}].amt=parseFloat(this.value);saveInternal();" style="margin:0; padding:5px;">
                        <span class="${p.amt - spent < 0 ? 'neg' : 'pos'}" style="text-align:right; font-weight:800;">$${Math.abs(p.amt - spent).toFixed(0)}</span>
                    </div>`;
                catHTML += `<option value="${p.name}">${p.name}</option>`;
            });

            expL.innerHTML = expHTML;
            catS.innerHTML = catHTML;
        }

        function addTransaction() {
            const d = document.getElementById('desc').value, c = document.getElementById('cat-select').value, a = parseFloat(document.getElementById('amt').value);
            if(!d || isNaN(a)) return;
            txns.unshift({ id: Date.now(), desc: d, cat: c, date: document.getElementById('txn-date').value, amt: -Math.abs(a) });
            document.getElementById('desc').value = ''; document.getElementById('amt').value = '';
            saveInternal();
        }

        function switchTab(t) {
            activeTab = t;
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            document.getElementById('view-budget').style.display = t === 'budget' ? 'block' : 'none';
            // Simple toggle for the others
            updateUI();
        }

        function closeModal() { document.getElementById('startup-modal').style.display = 'none'; }
    </script>
</body>
</html>
