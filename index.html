<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monarch-Lite v21.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --m-blue: #0a192f; 
            --m-teal: #17e9e1; 
            --m-bg: #121212; 
            --m-card: #1e1e1e; 
            --m-red: #ff5252; 
            --m-green: #2ecc71; 
            --m-header-green: #1b4d3e; 
            --m-orange: #ff9f43; 
            --m-text: #ffffff; 
        }
        body { font-family: 'Inter', sans-serif; background: var(--m-bg); margin: 0; padding: 10px; color: var(--m-text); padding-bottom: 80px; }
        
        /* Modals */
        #startup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .modal-card { background: var(--m-card); padding: 25px; border-radius: 24px; border: 1px solid var(--m-teal); width: 90%; max-width: 500px; text-align: center; }
        
        /* Headers & Charts */
        .budget-header { color: white; padding: 20px; border-radius: 16px; margin-bottom: 12px; text-align: center; position: relative; transition: all 0.3s ease; }
        .bg-spending { background: var(--m-header-green); border: 1px solid var(--m-green); }
        .bg-invest { background: var(--m-blue); border: 1px solid var(--m-teal); }
        .bg-liab { background: #3d2b1f; border: 1px solid var(--m-orange); }
        
        .chart-container { background: var(--m-card); border-radius: 16px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        canvas { max-width: 250px !important; max-height: 250px !important; }

        /* Navigation */
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #222; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; border: none; opacity: 0.6; }
        .tab.active { background: var(--m-teal) !important; color: var(--m-blue) !important; opacity: 1; }

        /* Cards & Lists */
        .card { background: var(--m-card); padding: 15px; border-radius: 16px; margin-bottom: 15px; }
        .budget-row { display: grid; grid-template-columns: 1fr 80px 80px; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
        .row-label { font-size: 11px; color: #888; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #333; background: #2a2a2a; color: white; border-radius: 8px; font-size: 14px; margin-bottom: 5px; box-sizing: border-box; }
        .btn-track { width: 100%; padding: 16px; background: var(--m-teal); color: var(--m-blue); border-radius: 12px; border: none; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-mgmt { flex: 1; background: #333; color: white; padding: 12px; border-radius: 12px; font-weight: bold; border: 1px solid #555; text-align: center; cursor: pointer; }
        
        .spending-bar-bg { background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px; margin: 10px 0; overflow: hidden; width: 100%; }
        .spending-bar-fill { height: 100%; width: 0%; transition: width 0.8s ease-in-out; }
        .pos { color: var(--m-green); }
        .neg { color: var(--m-red); }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--m-teal); color: var(--m-blue); padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 10000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="startup-modal">
        <div class="modal-card">
            <h2 style="color:var(--m-teal);">Monarch Lite</h2>
            <button class="btn-track" onclick="closeModal()">Continue Session</button>
            <button class="btn-mgmt" style="width:100%; margin-top:10px;" onclick="location.reload()">Refresh App</button>
        </div>
    </div>

    <div id="toast">Changes Saved!</div>

    <div class="budget-header bg-spending" id="main-header">
        <div id="header-content"></div>
    </div>

    <select id="month-filter" onchange="updateUI()">
        <option value="01">January</option><option value="02">February</option><option value="03">March</option>
        <option value="04">April</option><option value="05">May</option><option value="06">June</option>
        <option value="07">July</option><option value="08">August</option><option value="09">September</option>
        <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>

    <nav class="tab-bar">
        <button class="tab active" id="tab-budget" onclick="switchTab('budget')">Budget</button>
        <button class="tab" id="tab-invest" onclick="switchTab('invest')">Net Worth</button>
    </nav>

    <div id="view-budget">
        <div class="chart-container">
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--m-teal);">SPENDING BY CATEGORY</div>
            <canvas id="spendingChart"></canvas>
        </div>

        <div class="card">
            <div id="sum-exp-text" style="font-size: 12px; color: var(--m-red); font-weight: bold; margin-bottom: 10px;">EXPENSES</div>
            <div id="expense-list"></div>
        </div>

        <div class="card">
            <b>Add Transaction</b>
            <input type="text" id="desc" placeholder="Merchant">
            <select id="cat-select"></select>
            <div style="display:flex; gap:10px;"><input type="date" id="txn-date"><input type="text" inputmode="decimal" id="amt" placeholder="Amount"></div>
            <button class="btn-track" onclick="addTransaction()">Track Transaction</button>
        </div>
    </div>

    <div id="view-invest" style="display:none;">
        <div class="card" id="invest-main-list"></div>
        <button class="btn-track" onclick="addItem('assets')">+ Add Asset</button>
    </div>

    <script>
        let txns = JSON.parse(localStorage.getItem('m_txns')) || [];
        let planInc = JSON.parse(localStorage.getItem('m_p_inc')) || [{name:"💵 Paychecks", amt: 5000}];
        let planExp = JSON.parse(localStorage.getItem('m_p_exp')) || [{name:"🛒 Groceries", amt: 600}, {name:"🏠 Mortgage", amt: 2000}, {name:"🚗 Transport", amt: 300}];
        let assets = JSON.parse(localStorage.getItem('m_assets')) || [{name: "Bank Account", amt: 10000}];
        let activeTab = 'budget';
        let spendingChart = null;

        window.onload = () => {
            document.getElementById('month-filter').value = String(new Date().getMonth() + 1).padStart(2, '0');
            document.getElementById('txn-date').valueAsDate = new Date();
            updateUI();
        };

        function saveInternal() {
            localStorage.setItem('m_txns', JSON.stringify(txns));
            localStorage.setItem('m_p_inc', JSON.stringify(planInc));
            localStorage.setItem('m_p_exp', JSON.stringify(planExp));
            localStorage.setItem('m_assets', JSON.stringify(assets));
            showToast();
            updateUI();
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1500);
        }

        function updateUI() {
            const selectedMonth = document.getElementById('month-filter').value;
            const monthTxns = txns.filter(t => t.date.split('-')[1] === selectedMonth);
            
            let actExp = 0, actInc = 0;
            const catTotals = {};

            monthTxns.forEach(t => {
                if(t.amt < 0) {
                    actExp += Math.abs(t.amt);
                    catTotals[t.cat] = (catTotals[t.cat] || 0) + Math.abs(t.amt);
                } else {
                    actInc += t.amt;
                }
            });

            // Update Header
            const budExpT = planExp.reduce((sum, p) => sum + p.amt, 0);
            const pSpent = budExpT > 0 ? Math.min((actExp / budExpT) * 100, 100) : 0;
            
            document.getElementById('header-content').innerHTML = `
                <div style="font-size: 1rem; opacity: 0.8;">Month Activity</div>
                <div style="font-size: 1.8rem; font-weight: 900;">$${actExp.toLocaleString()}</div>
                <div class="spending-bar-bg"><div class="spending-bar-fill" style="width:${pSpent}%; background:var(--m-green)"></div></div>
            `;

            // Update Expense List
            let expHTML = '';
            planExp.forEach((p, idx) => {
                const spent = monthTxns.filter(t => t.cat === p.name).reduce((sum, t) => sum + Math.abs(t.amt), 0);
                expHTML += `
                    <div class="budget-row">
                        <span>${p.name}</span>
                        <input type="number" value="${p.amt}" onchange="planExp[${idx}].amt=parseFloat(this.value);saveInternal();">
                        <span style="text-align:right; font-weight:bold; color:${spent > p.amt ? 'var(--m-red)' : 'white'}">$${spent.toFixed(0)}</span>
                    </div>`;
            });
            document.getElementById('expense-list').innerHTML = expHTML;

            // Update Category Select
            let catHTML = '';
            [...planInc, ...planExp].forEach(c => catHTML += `<option value="${c.name}">${c.name}</option>`);
            document.getElementById('cat-select').innerHTML = catHTML;

            renderChart(catTotals);
        }

        function renderChart(data) {
            const ctx = document.getElementById('spendingChart').getContext('2d');
            const labels = Object.keys(data);
            const values = Object.values(data);

            if (spendingChart) spendingChart.destroy();

            spendingChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#17e9e1', '#2ecc71', '#ff9f43', '#ff5252', '#9b59b6', '#3498db'],
                        borderWidth: 0
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    cutout: '70%'
                }
            });
        }

        function addTransaction() {
            const d = document.getElementById('desc').value;
            const c = document.getElementById('cat-select').value;
            const a = parseFloat(document.getElementById('amt').value);
            if(!d || isNaN(a)) return;

            const isInc = planInc.some(p => p.name === c);
            txns.unshift({ id: Date.now(), desc: d, cat: c, date: document.getElementById('txn-date').value, amt: isInc ? a : -a });
            saveInternal();
        }

        function switchTab(t) {
            activeTab = t;
            document.getElementById('view-budget').style.display = t === 'budget' ? 'block' : 'none';
            document.getElementById('view-invest').style.display = t === 'invest' ? 'block' : 'none';
            document.getElementById('tab-budget').className = t === 'budget' ? 'tab active' : 'tab';
            document.getElementById('tab-invest').className = t === 'invest' ? 'tab active' : 'tab';
        }

        function closeModal() { document.getElementById('startup-modal').style.display = 'none'; }
    </script>
</body>
</html>
